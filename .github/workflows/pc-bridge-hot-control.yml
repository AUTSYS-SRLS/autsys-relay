name: PC Bridge Hot Control

on:
  push:
    branches:
      - pc-bridge-control
    paths:
      - control/command.json

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Dispatch command to AUTSYS PC Bridge
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          request_id="${COMMIT_MESSAGE#PCBRIDGE:}"
          if [[ ! "$request_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "Invalid PC Bridge request id" >&2
            exit 2
          fi
          echo "PC_BRIDGE_REQUEST_ID=${request_id}"
          curl --fail-with-body --silent --show-error \
            --max-time 330 \
            "https://autsys-pc-bridge-gateway.onrender.com/chat-control/pull?commit=${GITHUB_SHA}&requestId=${request_id}"
          echo
