name: Relay MCP and Redis read-only isolated smoke

on:
  push:
    branches:
      - test/relay-mcp-smoke-20261021
      - feat/read-only-relay-redis-inspector-20261021
  pull_request:
    branches:
      - pc-bridge-gateway

permissions:
  contents: read

jobs:
  mcp-tools-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Read-only Redis key and queue integrity tests
        env:
          NODE_ENV: test
          AUTSYS_TEST_REDIS_URL: redis://127.0.0.1:6379/14
        run: node --test test/relay-redis-inspection.test.js
      - name: End-to-end MCP tools/list + tools/call with fake Bridge and local Redis
        run: node --test test/relay-mcp-tools-smoke.test.js
